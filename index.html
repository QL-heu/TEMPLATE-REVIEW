<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Trợ lý Tổng quan Tài liệu</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/exceljs@4.4.0/dist/exceljs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>
<style>
:root{
  --bg:#f5f6f8;--surface:#fff;--surface-2:#f0f2f5;--border:#e2e5ea;--border-strong:#cdd3db;
  --text:#18202b;--muted:#5b6574;--faint:#8a93a1;
  --primary:#2b59c3;--primary-hover:#234aa6;--primary-soft:#e8eefb;--on-primary:#fff;
  --ok:#17804f;--ok-soft:#e4f4eb;--warn:#a2620a;--warn-soft:#fdf1dc;--danger:#c0362c;--danger-soft:#fdeceb;
  --edit:#6a43c4;--edit-soft:#f0eafc;--hl:rgba(255,200,0,.38);
  --radius:10px;--shadow:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.07);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f1318;--surface:#171c23;--surface-2:#1f252e;--border:#2a313b;--border-strong:#3b4451;
  --text:#e6e9ee;--muted:#a3acb9;--faint:#76808e;
  --primary:#7097ff;--primary-hover:#8daeff;--primary-soft:#1c2741;--on-primary:#0b1020;
  --ok:#4cc38a;--ok-soft:#13281e;--warn:#e9a84a;--warn-soft:#2d2313;--danger:#ff7b72;--danger-soft:#341a1a;
  --edit:#b49bff;--edit-soft:#251d39;--hl:rgba(255,200,0,.32);
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0f1318;--surface:#171c23;--surface-2:#1f252e;--border:#2a313b;--border-strong:#3b4451;
  --text:#e6e9ee;--muted:#a3acb9;--faint:#76808e;
  --primary:#7097ff;--primary-hover:#8daeff;--primary-soft:#1c2741;--on-primary:#0b1020;
  --ok:#4cc38a;--ok-soft:#13281e;--warn:#e9a84a;--warn-soft:#2d2313;--danger:#ff7b72;--danger-soft:#341a1a;
  --edit:#b49bff;--edit-soft:#251d39;--hl:rgba(255,200,0,.32);
  --shadow:0 1px 2px rgba(0,0,0,.4);color-scheme:dark;}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font:14px/1.55 "Be Vietnam Pro",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
a{color:var(--primary)}
h1{font-size:22px;line-height:1.3;margin:0 0 4px;font-weight:700;letter-spacing:-.01em}
h2{font-size:17px;margin:0 0 12px;font-weight:600}
h3{font-size:14px;margin:0 0 10px;font-weight:600}
p{margin:0 0 8px}
.muted{color:var(--muted)}.small{font-size:12.5px}.sp{flex:1}
.ic{width:18px;height:18px;flex:none}
button,input,select,textarea{font:inherit;color:inherit}
input[type=text],input[type=email],input[type=password],input[type=number],input[type=search],select,textarea{
  background:var(--surface);border:1px solid var(--border-strong);border-radius:8px;padding:7px 10px;outline:none;max-width:100%}
input:focus,select:focus,textarea:focus{border-color:var(--primary);box-shadow:0 0 0 3px var(--primary-soft)}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--border-strong);background:var(--surface);border-radius:8px;padding:7px 12px;cursor:pointer;font-weight:500;white-space:nowrap;text-decoration:none;color:var(--text)}
.btn:hover{background:var(--surface-2)}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.primary{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.btn.primary:hover{background:var(--primary-hover)}
.btn.danger{color:var(--danger)}
.btn.ok{background:var(--ok-soft);border-color:transparent;color:var(--ok)}
.btn.sm{padding:4px 10px;font-size:13px}.btn.xs{padding:2px 8px;font-size:12px;border-radius:6px}
.btn.ghost{border-color:transparent;background:transparent}
.link{background:none;border:0;color:var(--primary);cursor:pointer;padding:0;font-size:12.5px}
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.badge{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.badge.ok{background:var(--ok-soft);color:var(--ok)}.badge.warn{background:var(--warn-soft);color:var(--warn)}
.badge.bad{background:var(--danger-soft);color:var(--danger)}.badge.info{background:var(--primary-soft);color:var(--primary)}
.badge.edit{background:var(--edit-soft);color:var(--edit)}
.callout{border-radius:var(--radius);padding:12px 14px;margin-bottom:16px;background:var(--primary-soft);color:var(--text);border:1px solid transparent}
.callout.warn{background:var(--warn-soft)}.callout.bad{background:var(--danger-soft)}
/* layout */
.layout{display:grid;grid-template-columns:244px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;background:var(--surface);border-right:1px solid var(--border);display:flex;flex-direction:column;padding:18px 12px;gap:18px;overflow:auto}
.brand{display:flex;gap:10px;align-items:center;padding:0 6px}
.brand .logo{width:32px;height:32px;border-radius:8px;background:var(--primary);color:var(--on-primary);display:grid;place-items:center;font-weight:700;font-size:13px}
.brand b{display:block;font-size:14px;line-height:1.2}.brand span{font-size:11.5px;color:var(--muted)}
.nav{display:flex;flex-direction:column;gap:2px}
.nav a{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:8px;color:var(--muted);text-decoration:none;font-weight:500}
.nav a:hover{background:var(--surface-2);color:var(--text)}
.nav a.active{background:var(--primary-soft);color:var(--primary)}
.qbox{border:1px solid var(--border);border-radius:var(--radius);padding:12px;font-size:12.5px;display:flex;flex-direction:column;gap:8px}
.qbox .qh{display:flex;justify-content:space-between;font-weight:600}
.bar{height:6px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.bar>span{display:block;height:100%;background:var(--primary);border-radius:99px;transition:width .3s}
.qcur{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qnote{color:var(--warn)}
.folders{display:flex;flex-direction:column;gap:4px;font-size:13px;min-height:0}
.fhead2{display:flex;justify-content:space-between;align-items:center;padding:0 6px;font-size:11.5px;font-weight:600;letter-spacing:.04em;text-transform:uppercase;color:var(--faint)}
.fhead2 .link{text-transform:none;letter-spacing:0;font-weight:500}
.ftree{display:flex;flex-direction:column;gap:1px;max-height:42vh;overflow:auto}
.frow{display:flex;align-items:center;gap:4px;padding:5px 6px;border-radius:7px;cursor:pointer;color:var(--muted);border:1px dashed transparent}
.frow:hover{background:var(--surface-2);color:var(--text)}
.frow.on{background:var(--primary-soft);color:var(--primary);font-weight:600}
.frow.sub{padding-left:22px;font-size:12.5px}
.frow.over{border-color:var(--primary);background:var(--primary-soft)}
body.dragging .frow[data-drop]{border-color:var(--border-strong)}
.frow .caret{width:16px;flex:none;border:0;background:none;color:inherit;cursor:pointer;padding:0;font-size:11px;text-align:center}
.frow .fn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .cnt{font-size:11.5px;color:var(--faint);font-variant-numeric:tabular-nums}
.frow .fm{border:0;background:none;color:var(--faint);cursor:pointer;padding:0 4px;border-radius:4px;opacity:0}
.frow:hover .fm,.frow.on .fm{opacity:1}
.fsel{display:none}
.fhint{padding:0 6px;font-size:11.5px}
.fchips{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
tr[draggable=true]{cursor:grab}
.bk{display:flex;gap:8px;align-items:center;justify-content:space-between;border:1px solid var(--border);border-radius:var(--radius);padding:8px 10px;font-size:12.5px}
.bk.due{border-color:var(--warn);background:var(--warn-soft)}
.choice{border:1px solid var(--border);border-radius:var(--radius);padding:14px;background:var(--surface-2)}
.or{display:flex;align-items:center;gap:10px;color:var(--faint);font-size:12px}.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--border)}
.side .user{margin-top:auto;font-size:12.5px;color:var(--muted);padding:0 6px;word-break:break-all}
main{padding:26px 30px 60px;min-width:0}
.page-head{display:flex;justify-content:space-between;align-items:flex-start;gap:16px;flex-wrap:wrap;margin-bottom:18px}
.page-head p{color:var(--muted);margin:0}
/* stats */
.stats{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-bottom:18px}
.stat{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:14px}
.stat b{display:block;font-size:24px;line-height:1.2;font-variant-numeric:tabular-nums}
.stat span{font-size:12.5px;color:var(--muted)}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(320px,1fr));gap:16px;margin-bottom:16px}
.list{display:flex;flex-direction:column}
.li{display:flex;gap:10px;align-items:center;padding:9px 0;border-top:1px solid var(--border);min-width:0}
.li:first-child{border-top:0}
.li .t{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hbar{display:grid;grid-template-columns:44px 1fr 32px;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.hbar .bar{height:10px}
/* upload */
.drop{border:2px dashed var(--border-strong);border-radius:var(--radius);padding:28px 16px;text-align:center;background:var(--surface);cursor:pointer;transition:.15s;display:block}
.drop.over{border-color:var(--primary);background:var(--primary-soft)}
.drop b{display:block;font-size:15px;margin-bottom:4px}
.toolbar{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:16px 0 10px}
.toolbar input[type=search]{min-width:220px;flex:1;max-width:340px}
.tw{overflow:auto;border:1px solid var(--border);border-radius:var(--radius);background:var(--surface)}
table{border-collapse:separate;border-spacing:0;width:100%;font-size:13px}
th,td{padding:8px 10px;border-bottom:1px solid var(--border);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--surface-2);font-weight:600;font-size:12.5px;z-index:2;white-space:nowrap}
tbody tr:hover td{background:color-mix(in srgb,var(--surface-2) 55%,transparent)}
td.nowrap{white-space:nowrap}
.fname{max-width:420px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.err{color:var(--danger);font-size:12px;white-space:normal}
/* big table */
.bt{max-height:calc(100vh - 230px)}
.bt th.sortable{cursor:pointer;user-select:none}
.bt th .arr{color:var(--faint);font-size:11px}
.bt .stk{position:sticky;left:0;z-index:1;background:var(--surface)}
.bt th.stk{z-index:3;background:var(--surface-2)}
.bt .stk2{position:sticky;left:36px;z-index:1;background:var(--surface);box-shadow:1px 0 0 var(--border)}
.bt th.stk2{z-index:3;background:var(--surface-2)}
.bt td.c{position:relative;cursor:text;padding:6px 22px 6px 8px}
.bt td.c:hover{outline:1px solid var(--border-strong);outline-offset:-1px}
.cell{display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.cell.m{color:var(--faint);font-style:italic}
td.c.v{box-shadow:inset 3px 0 0 var(--ok)}
td.c.e{box-shadow:inset 3px 0 0 var(--edit)}
td.c.w{box-shadow:inset 3px 0 0 var(--warn);background:color-mix(in srgb,var(--warn-soft) 60%,transparent)}
.vbtn{position:absolute;top:4px;right:3px;border:0;background:transparent;color:var(--faint);cursor:pointer;font-size:12px;opacity:0;border-radius:4px;padding:0 3px}
td.c:hover .vbtn,.vbtn.on{opacity:1}.vbtn.on{color:var(--ok)}
.cell-edit{width:100%;min-height:110px;resize:vertical;font-size:13px;padding:6px}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-bottom:8px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.colmenu{position:relative}
.colmenu .pop{position:absolute;right:0;top:110%;background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);box-shadow:0 8px 24px rgba(0,0,0,.14);padding:8px;z-index:30;width:260px;max-height:360px;overflow:auto}
.colmenu label{display:flex;gap:8px;padding:3px 4px;font-size:13px;cursor:pointer}
/* detail */
.dnav{display:flex;gap:6px;align-items:center;margin-bottom:12px;flex-wrap:wrap}
.dnav select{flex:1;min-width:0;max-width:560px}
.dmeta{display:flex;gap:8px;align-items:center;flex-wrap:wrap;color:var(--muted);font-size:12.5px;margin-top:4px}
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.fcard{background:var(--surface);border:1px solid var(--border);border-left:3px solid var(--border);border-radius:var(--radius);padding:12px 14px;margin-bottom:10px}
.fcard.v{border-left-color:var(--ok)}.fcard.e{border-left-color:var(--edit)}.fcard.w{border-left-color:var(--warn)}
.fhead{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:6px}
.fnum{font-size:11px;color:var(--faint);font-variant-numeric:tabular-nums;width:18px}
.flabel{font-weight:600}
.fval{width:100%;resize:vertical;min-height:38px;overflow:hidden;line-height:1.5}
.fmeta{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:6px;font-size:12.5px;color:var(--muted)}
.fmeta input{width:70px;padding:3px 6px;font-size:12.5px}
.fquote{width:100%;font-size:12.5px;font-style:italic;color:var(--muted);background:var(--surface-2);border-color:transparent;resize:vertical;min-height:34px;margin-top:6px}
.fnote{font-size:12px;color:var(--warn);margin-top:4px}
.chips{display:flex;gap:6px;margin:0 0 12px;flex-wrap:wrap}
.chip{border:1px solid var(--border-strong);background:var(--surface);border-radius:999px;padding:3px 12px;font-size:12.5px;cursor:pointer}
.chip.on{background:var(--primary);border-color:var(--primary);color:var(--on-primary)}
.viewer-col{align-self:stretch}
.viewer{position:sticky;top:16px;padding:0;overflow:hidden}
.vbar{display:flex;gap:6px;align-items:center;padding:8px 10px;border-bottom:1px solid var(--border);font-size:13px}
.vscroll{height:calc(100vh - 110px);overflow:auto;background:var(--surface-2);padding:8px;position:relative}
.vscroll canvas{display:block;margin:0 auto;box-shadow:0 1px 4px rgba(0,0,0,.2);background:#fff}
.vmsg{padding:30px;text-align:center;color:var(--muted)}
.summary p{margin:0;white-space:pre-wrap}
/* reports */
.report{line-height:1.7}
.report h1,.report h2{margin:20px 0 8px}.report h2{font-size:16px}.report h3{margin:14px 0 6px}
.report table{margin:10px 0;font-size:13px}.report th,.report td{border:1px solid var(--border)}
.report th{position:static}
.report ul,.report ol{padding-left:22px}
/* forms */
.form{display:flex;flex-direction:column;gap:14px;max-width:560px}
.form label{display:flex;flex-direction:column;gap:5px;font-weight:500}
.form label small{font-weight:400;color:var(--muted)}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 0;cursor:pointer}
.form label.opt{flex-direction:row;font-weight:400}
.opt input{margin-top:4px;flex:none}
/* auth */
.auth{min-height:100vh;display:grid;place-items:center;padding:16px}
.auth-card{width:100%;max-width:400px;background:var(--surface);border:1px solid var(--border);border-radius:14px;padding:28px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:14px}
.auth-card label{display:flex;flex-direction:column;gap:5px;font-weight:500}
/* misc */
.empty{padding:40px 16px;text-align:center;color:var(--muted)}
.loading{padding:40px;text-align:center;color:var(--muted)}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;display:inline-block;animation:sp .8s linear infinite;vertical-align:-2px}
@keyframes sp{to{transform:rotate(360deg)}}
#toasts{position:fixed;right:16px;bottom:16px;display:flex;flex-direction:column;gap:8px;z-index:100;max-width:min(380px,calc(100vw - 32px))}
.toast{background:var(--text);color:var(--bg);padding:10px 14px;border-radius:8px;box-shadow:0 6px 20px rgba(0,0,0,.2);font-size:13px}
.toast.error{background:var(--danger);color:#fff}.toast.ok{background:var(--ok);color:#fff}
.modal-bg{position:fixed;inset:0;background:rgba(10,14,20,.45);display:grid;place-items:center;z-index:90;padding:16px}
.modal{background:var(--surface);border-radius:14px;padding:22px;max-width:480px;width:100%;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.modal .row{justify-content:flex-end;margin-top:18px}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--border);margin-bottom:16px}
.tabs a{padding:8px 14px;text-decoration:none;color:var(--muted);font-weight:500;border-bottom:2px solid transparent;margin-bottom:-1px}
.tabs a.on{color:var(--primary);border-bottom-color:var(--primary)}
.collist{columns:2;column-gap:20px;font-size:12.5px;color:var(--muted);margin:0;padding-left:22px}
@media (max-width:1100px){.detail{grid-template-columns:1fr}.viewer{position:static}.vscroll{height:62vh}.viewer-col{order:-1;align-self:start}}
@media (max-width:860px){
  .layout{grid-template-columns:1fr}
  .side{position:sticky;top:0;height:auto;z-index:40;padding:10px 16px;gap:8px;border-right:0;border-bottom:1px solid var(--border)}
  .brand span{display:none}
  .nav{flex-direction:row;overflow-x:auto;gap:2px;margin:0 -4px}
  .nav a{white-space:nowrap;padding:6px 10px;font-size:13px}
  .nav a .ic{display:none}
  .qbox{padding:8px 10px;gap:5px}
  .ftree,.fhint{display:none}
  .fsel{display:block;width:100%}
  .fhead2{padding:0}
  .side .user{display:none}
  main{padding:16px 16px 60px}
  .collist{columns:1}
  .bt{max-height:none}
}
</style>
</head>
<body>
<div id="app"><div class="loading">Đang tải…</div></div>
<div id="toasts"></div>
<div id="modal"></div>
<script>
// =====================================================================
//  CẤU HÌNH — điền 2 dòng dưới bằng thông tin Supabase của bạn
//  (Supabase → Project Settings → API). Anon key được phép công khai;
//  dữ liệu được bảo vệ bằng RLS + đăng nhập.
// =====================================================================
const CONFIG = {
  SUPABASE_URL: '',        // ví dụ: 'https://abcdxyz.supabase.co'
  SUPABASE_ANON_KEY: '',   // chuỗi "anon public"
  BUCKET: 'papers',
  DEFAULT_MODEL: 'gemini-2.5-flash',
};

// ---------------------------------------------------------------------
const NA = 'Không được đề cập';
const FIELDS = [
  {k:'title',label:'Tên bài báo',xl:'Article title',w:36,hint:'Full title in original language, not translated'},
  {k:'short_title',label:'Tên bài báo rút gọn',xl:'Article title -SUB',w:24,hint:'Short title ≤ 8 words, original language; quote may be empty'},
  {k:'journal',label:'Tên tạp chí',xl:'Journal',w:24,hint:'Journal name as printed'},
  {k:'year',label:'Năm xuất bản',xl:'Year',w:10,hint:'Publication year (4 digits)'},
  {k:'rank',label:'Xếp hạng tạp chí',xl:'Quartile',w:10},
  {k:'author_year',label:'Tác giả (Năm)',xl:'Author (Year)',w:22,hint:'APA in-text form, e.g. "Smith & Lee (2023)" or "Smith et al. (2023)"'},

function parseFileName(name){
  const base=String(name).replace(/\.pdf$/i,'');
  const r=base.match(/(?:^|[^A-Za-z0-9])Q([1-4])(?![A-Za-z0-9])/i);
  const n=base.match(/^\s*(\d{1,4})\s*[.\-_)\s]/);
  return {rank:r?'Q'+r[1]:null,no:n?parseInt(n[1],10):null};
}
function normDoi(v){const m=String(v).match(/10\.\d{4,9}\/[^\s"<>]+/);return m?'https://doi.org/'+m[0].replace(/[.,;)\]]+$/,''):v}
const norm = s=>String(s||'').normalize('NFKD').replace(/[̀-ͯ]/g,'').toLowerCase()
  .replace(/-\s*\n\s*/g,'').replace(/[^a-z0-9]+/g,' ').trim();
const pageList = s=>[...String(s||'').matchAll(/\d+/g)].map(m=>+m[0]);
function quoteScore(q,text){
  if(!q||!text) return 0;
  if(text.includes(q)) return 1;
  const w=q.split(' ');if(w.length<4) return 0;
  let hit=0,tot=0;
  for(let i=0;i+3<=w.length;i++){tot++;if(text.includes(w.slice(i,i+3).join(' ')))hit++}
  return hit/tot;
}
function verifyQuote(quote,pageStr,npages){
  const q=norm(quote);if(!q) return {ok:null};
  const order=[...new Set([...pageList(pageStr).map(n=>n-1),...npages.map((_,i)=>i)])].filter(i=>i>=0&&i<npages.length);
  for(const i of order) if(quoteScore(q,npages[i])>=0.8) return {ok:true,page:i+1};
  return {ok:false};
}
function fieldState(v){
  const missing=!v||isNA(v.value);
  const issues=[];
  if(missing) issues.push('missing');
  if(v?.flag&&FLAG_LABEL[v.flag]) issues.push(v.flag);
  if(v?.quote_ok===false) issues.push('quote');
  return {missing,issues,source:v?.source||'ai',warn:issues.some(i=>i!=='missing')};
}

  for(const f of FIELDS){const st=fieldState(p.fields?.[f.k]);if(st.source==='verified')verified++;else if(st.warn)issues++;if(st.missing)missing++}
  return {verified,issues,missing,total:FIELDS.length,full:verified===FIELDS.length};
}

function topicOf(p){
  const dv=fv(p,'dv'),ti=fv(p,'title'),kw=(String(p.summary||'').match(/Từ khóa:(.*)$/m)||[])[1]||'',su=String(p.summary||'');
  let best=null;
  TOPICS.forEach(([label,re],i)=>{const sc=countRe(isNA(dv)?'':dv,re)*5+countRe(ti,re)*3+countRe(kw,re)*2+Math.min(3,countRe(su,re));if(sc>0&&(!best||sc>best.sc))best={label,key:label,sc}});
  if(best) return best;
  const d=isNA(dv)?'':String(dv).replace(/^Từ khóa của bài:\s*/i,'').split(/;|\n/)[0].replace(/\(.*?\)/g,'').trim();
  if(d&&d.length>2){const lab=cap(d.split(/\s+/).slice(0,6).join(' '));return {label:lab,key:'dv:'+lab.toLowerCase()}}
  return {label:'Khác (chưa xác định chủ đề)',key:'other'};
}
// Xếp bài vào thư mục con theo chủ đề, trong từng thư mục hướng nghiên cứu chứa bài.
// Bỏ qua nếu bạn đã tự xếp bài vào một thư mục con của hướng đó.
async function autoClassify(p,force=false){
  if(!p||p.status!=='done'||state.foldersMissing) return 0;
  const topic=topicOf(p);let moved=0;
  for(const top of topFolders()){
    const subs=subFolders(top.id),subIds=new Set(subs.map(x=>x.id));
    const mine=state.links.filter(l=>l.paper_id===p.id&&(l.folder_id===top.id||subIds.has(l.folder_id)));
    if(!mine.length) continue;
    if(!force&&mine.some(l=>subIds.has(l.folder_id)&&!l.auto)) continue;
    let sub=subs.find(x=>x.auto_key===topic.key)||subs.find(x=>x.name.toLowerCase()===topic.label.toLowerCase());
    if(!sub) sub=await createFolder(topic.label,top.id,topic.key);
    if(!sub) continue;
    if(!mine.some(l=>l.folder_id===sub.id)) {await linkPaper(p.id,sub.id,true);moved++}
    for(const l of mine) if(l.folder_id!==sub.id) await unlinkPaper(p.id,l.folder_id);
  }
  return moved;
}

async function placePapers(ids,target,mode){
  if(!ids.length||!folderById(target)) return;
  let n=0;
  try{
    for(const id of ids){
      if(mode==='move'&&state.folder){
        const from=state.folder?folderScopeIds(state.folder):state.links.filter(l=>l.paper_id===id).map(l=>l.folder_id);

const cleanStr=t=>t.replace(/[\u0000-\u0008\u000B\u000C\u000E-\u001F\u007F\uFFFE\uFFFF]/g,'').replace(/[\uD800-\uDBFF](?![\uDC00-\uDFFF])|(?<![\uD800-\uDBFF])[\uDC00-\uDFFF]/g,'');
function cleanDeep(v){
  if(typeof v==='string') return cleanStr(v);

  return v;
}

async function extractPages(buf){
  const doc=await pdfjsLib.getDocument({data:buf}).promise;
  const out=[];
  for(let i=1;i<=doc.numPages;i++){
    const tc=await (await doc.getPage(i)).getTextContent();
    out.push(cleanStr(tc.items.map(it=>it.str+(it.hasEOL?'\n':' ')).join('')));
  }
  await doc.destroy();return out;
}

const pdfCache=new Map();
function getPdfDoc(p){
  if(!pdfCache.has(p.id)){
    pdfCache.set(p.id,(async()=>{const b=await downloadPdf(p);return pdfjsLib.getDocument({data:await b.arrayBuffer()}).promise})());
    pdfCache.get(p.id).catch(()=>pdfCache.delete(p.id));
    while(pdfCache.size>4){const [k,v]=pdfCache.entries().next().value;if(k===V.pid)break;pdfCache.delete(k);v.then(d=>d.destroy()).catch(()=>{})}
  }
  return pdfCache.get(p.id);
}

function pickModel(ms){

  const stable=ms.filter(m=>/flash/i.test(m)&&!bad.test(m)).sort((a,b)=>ver(b)-ver(a)||a.length-b.length);
  return ms.find(m=>m==='gemini-flash-latest')||stable[0]||ms.find(m=>/flash/i.test(m)&&!/lite/i.test(m))||ms.find(m=>/flash/i.test(m))||ms[0]||null;
}

// Chuyển schema dạng Gemini (OBJECT/STRING) sang JSON Schema chuẩn (strict) cho OpenAI
function toJsonSchema(g){
  const t=String(g.type||'string').toLowerCase();
  if(t==='object'){const props={};for(const [k,v] of Object.entries(g.properties||{})) props[k]=toJsonSchema(v);
    return {type:'object',...(g.description?{description:g.description}:{}),properties:props,required:Object.keys(props),additionalProperties:false}}
  if(t==='array') return {type:'array',items:toJsonSchema(g.items||{type:'STRING'})};
  return {type:t,...(g.description?{description:g.description}:{})};
}
async function listOpenAIModels(key){
  const r=await fetch('https://api.openai.com/v1/models',{headers:{Authorization:'Bearer '+key}});
  const d=await r.json().catch(()=>({}));
  if(!r.ok) throw new Error(d.error?.message||r.statusText);
  return (d.data||[]).map(m=>m.id).filter(id=>/^(gpt-|o\d)/.test(id)&&!/audio|realtime|tts|transcribe|search|image|instruct|codex|embedding|moderation|dall|whisper|chat-latest|preview|computer|oss/i.test(id));
}
function pickOpenAIModel(ids){
  const ver=id=>parseFloat((id.match(/^gpt-(\d+(?:\.\d+)?)/)||[])[1]||0);
  const plain=ids.filter(id=>/^gpt-\d/.test(id)&&!/\d{4}-\d{2}-\d{2}/.test(id));
  const mini=plain.filter(id=>/-mini$/.test(id)).sort((a,b)=>ver(b)-ver(a));
  return mini[0]||plain.sort((a,b)=>ver(b)-ver(a))[0]||ids[0]||null;
}
async function callOpenAI({system,content,schema}){
  if(!S.openaiKey) throw new AppErr('Chưa nhập OpenAI API key (vào Cài đặt).',{pause:true});
  let switched=false;
  for(let attempt=0;attempt<5;attempt++){
    const body={model:S.openaiModel,messages:[{role:'system',content:system},{role:'user',content}],
      ...(schema?{response_format:{type:'json_schema',json_schema:{name:'extraction',strict:true,schema:toJsonSchema(schema)}}}:{})};
    let res;
    try{res=await fetch('https://api.openai.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json',Authorization:'Bearer '+S.openaiKey},body:JSON.stringify(body)})}
    catch(e){if(attempt<4){await sleep(5000*(attempt+1));continue}throw new AppErr('Lỗi mạng khi gọi OpenAI: '+e.message,{retry:true})}
    if(res.ok){
      const data=await res.json();const ch=data.choices?.[0];
      if(!ch) throw new AppErr('OpenAI không trả kết quả.');
      if(ch.message?.refusal) throw new AppErr('OpenAI từ chối xử lý: '+ch.message.refusal);
      if(ch.finish_reason==='length') throw new AppErr('Kết quả bị cắt do quá dài.',{retry:true});
      const text=ch.message?.content||'';
      if(!schema) return text;
      try{return JSON.parse(text)}catch{const m=text.match(/\{[\s\S]*\}/);try{if(m)return JSON.parse(m[0])}catch{}throw new AppErr('OpenAI trả về JSON không hợp lệ.',{retry:true})}
    }
    const err=await res.json().catch(()=>({}));const msg=err.error?.message||res.statusText,code=err.error?.code||'';
    if(res.status===401) throw new AppErr('OpenAI API key không hợp lệ: '+msg,{pause:true});
    if(res.status===429){
      if(/insufficient_quota|billing|quota/i.test(code+msg)) throw new AppErr('Tài khoản OpenAI đã hết credit / chưa nạp tiền (insufficient quota). Nạp thêm tại platform.openai.com → Billing rồi bấm Tiếp tục.',{pause:true});
      const ra=parseFloat(res.headers.get('retry-after')||'');const wait=(isFinite(ra)?ra*1000:15000*(attempt+1))+1000;
      Q.note=`Giới hạn tốc độ của OpenAI — chờ ${Math.round(wait/1000)} giây…`;renderQueueBox();await sleep(wait);Q.note='';renderQueueBox();continue;
    }
    if(res.status>=500){await sleep(10000*(attempt+1));continue}
    if((res.status===404||code==='model_not_found'||/model.*(does not exist|not found|do not have access)/i.test(msg))&&!switched){
      switched=true;
      try{const pick=pickOpenAIModel(await listOpenAIModels(S.openaiKey));
        if(pick&&pick!==S.openaiModel){const old=S.openaiModel;S.openaiModel=pick;saveSettings();toast(`Model “${old}” không dùng được — đã tự chuyển sang “${pick}”.`,'ok');attempt--;continue}}catch(e){console.warn(e)}
      throw new AppErr(`Không dùng được model "${S.openaiModel}". Vào Cài đặt → bấm "Kiểm tra key" để chọn model khác.`,{pause:true});
    }
    if(res.status===400&&/file|pdf/i.test(msg)) throw new AppErr(`Model "${S.openaiModel}" không đọc được file PDF: ${msg}. Hãy chọn model khác (vd. dòng gpt-4.1 / gpt-4o / gpt-5).`,{pause:true});
    throw new AppErr(`OpenAI lỗi ${res.status}: ${msg}`);
  }
  throw new AppErr('OpenAI đang quá tải, đã thử lại nhiều lần.',{retry:true});
}

async function callGemini({system,parts,schema}){
  if(!S.geminiKey) throw new AppErr('Chưa nhập Gemini API key (vào Cài đặt).',{pause:true});
  const body={systemInstruction:{parts:[{text:system}]},contents:[{role:'user',parts}],
    generationConfig:{temperature:0.1,...(schema?{responseMimeType:'application/json',responseSchema:schema}:{})}};
  let url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent?key=${encodeURIComponent(S.geminiKey)}`;
  let switched=false;
  for(let attempt=0;attempt<5;attempt++){
    let res;
    try{res=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)})}
    catch(e){if(attempt<4){await sleep(5000*(attempt+1));continue}throw new AppErr('Lỗi mạng khi gọi Gemini: '+e.message,{retry:true})}
    if(res.ok){
      const data=await res.json();
      const c=data.candidates?.[0];
      if(!c) throw new AppErr('Gemini không trả kết quả'+(data.promptFeedback?.blockReason?' (bị chặn: '+data.promptFeedback.blockReason+')':''));
      const text=(c.content?.parts||[]).filter(x=>!x.thought).map(x=>x.text||'').join('');
      if(c.finishReason==='MAX_TOKENS') throw new AppErr('Kết quả bị cắt do quá dài (MAX_TOKENS).',{retry:true});
      if(!schema) return text;
      try{return JSON.parse(text)}catch{
        const m=text.match(/\{[\s\S]*\}/);try{if(m)return JSON.parse(m[0])}catch{}
        throw new AppErr('Gemini trả về JSON không hợp lệ.',{retry:true});
      }
    }
    const err=await res.json().catch(()=>({}));
    const msg=err.error?.message||res.statusText;
    if(res.status===429){
      const det=err.error?.details||[];
      if(/PerDay/i.test(JSON.stringify(det))) throw new AppErr('Đã hết hạn mức miễn phí trong ngày của Gemini. Hàng đợi tạm dừng và sẽ tự thử lại sau 30 phút.',{pause:true,daily:true});
      const rd=det.find(d=>d.retryDelay)?.retryDelay;
      const wait=rd?parseFloat(rd)*1000+1500:20000*(attempt+1);
      Q.note=`Giới hạn tốc độ của Gemini — chờ ${Math.round(wait/1000)} giây…`;renderQueueBox();
      await sleep(wait);Q.note='';renderQueueBox();continue;
    }
    if(res.status>=500){await sleep(10000*(attempt+1));continue}
    if(res.status===403||(res.status===400&&/api key/i.test(msg))) throw new AppErr('Gemini API key không hợp lệ: '+msg,{pause:true});
    if(res.status===404||(res.status===400&&/model.*(not found|not supported|deprecated)|no longer available/i.test(msg))){
      if(!switched){
        switched=true;
        try{
          const pick=pickModel(await listGeminiModels(S.geminiKey));
          if(pick&&pick!==S.model){
            const old=S.model;S.model=pick;saveSettings();
            toast(`Model “${old}” không còn dùng được — đã tự chuyển sang “${pick}”.`,'ok');
            url=`https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(S.model)}:generateContent?key=${encodeURIComponent(S.geminiKey)}`;
            attempt--;continue;
          }
        }catch(e){console.warn(e)}
      }
      throw new AppErr(`Không tìm thấy model "${S.model}". Vào Cài đặt → bấm "Kiểm tra key" để chọn model khác.`,{pause:true});
    }
    throw new AppErr(`Gemini lỗi ${res.status}: ${msg}`);
  }
  throw new AppErr('Gemini đang quá tải, đã thử lại nhiều lần.',{retry:true});
}

function buildFields(ai,p,npages,scanned,source='ai'){
  const old=p.fields||{},keep=!p.overwrite_all,out={};
  for(const f of FIELDS){
    const o=old[f.k];

  R.mod=hv.mod.length?mk(hv.mod.join('; '),find(bodyS,/moderat/i)[0]||hS,{flag:'unclear',note:vNote}):(/moderat(es|ing|ion|or)\b/i.test(bodyText)?mk('Bài có nhắc đến biến điều tiết (moderation) — cần xác định',find(bodyS,/moderat(es|ing|ion|or)\b/i)[0],{flag:'unclear'}):mk(''));
  const ctlS=find(bodyS,/control variables?|controlled for|as controls?\b/i)[0];
  R.ctrl=ctlS?mk(trunc(ctlS.s,300),ctlS,{flag:'unclear',note:'Câu trong bài có nhắc biến kiểm soát — cần rút gọn'}):mk('');

  // Kết quả, thang đo, kết luận, hạn chế
  const fAbs=find(abs,/\b(result|finding|found|reveal|show|indicat|confirm|suggest|significant|support|evidence)/i,3);
  const resS=S_('results').concat(S_('discussion'));
  const fRes=find(resS,/\b(not supported|supported|rejected|accepted)\b/i,3);
  const fAll=[...fAbs,...fRes.filter(x=>!fAbs.includes(x))].slice(0,5);
  const hypLines=hyp.filter(h=>HR[h.k]).map(h=>{const r=HR[h.k],pth=pathOf(h);return `${h.k}${pth?` (${pth})`:''}: ${r.decShort}${r.dir?', '+r.dir:''}${r.stats?` (${r.stats})`:''}`});
  const firstRow=hyp.map(h=>HR[h.k]?.src).find(Boolean);
  R.findings=hypLines.length
    ?mk([...hypLines,fAbs[0]&&'Tóm tắt của tác giả: '+fAbs[0].s].filter(Boolean).join('\n'),firstRow||fAbs[0])
    :mk(fAll.map(x=>'• '+x.s).join('\n'),fAll[0]);
  const lik=(bodyText.match(/\b(\d|five|seven|six|four|ten)[- ]point\b/i)||[])[1];
  const scS=find(methS,/likert|\b(\d|five|seven)[- ]point|adopted from|adapted from|measured (using|with|by)|items? (were|was) (adopted|adapted|used)|measurement items/i,3);
  R.scales=mk([lik&&`Likert ${({five:5,seven:7,six:6,four:4,ten:10})[lik.toLowerCase()]||lik} điểm`,...scS.map(x=>'• '+x.s)].filter(Boolean).join('\n'),scS[0]);
  const conS=S_('conclusion').length?S_('conclusion'):S_('discussion').slice(-6);
  const con=conS.slice(0,3);
  R.conclusion=mk(con.map(x=>x.s).join(' '),con[0]);
  const limAll=S_('limitations'),li=limAll.findIndex(x=>/limitation|future (research|studies|study|scholars|authors)/i.test(x.s));
  let limS=limAll.slice(li>=0?li:0,(li>=0?li:0)+4);if(!limS.length) limS=find(bodyS,/limitation|future (research|studies|study)/i,3);
  R.limitations=mk(limS.map(x=>'• '+x.s).join('\n'),limS[0]);

  // Điểm bất thường (quy tắc)
  if(/retract(ed|ion)/i.test(pages.join(' ').slice(0,20000))) anomalies.push('Có từ “retracted/retraction” — kiểm tra bài có bị rút không');
  if(!S_('limitations').length&&!limS.length) anomalies.push('Không thấy phần hạn chế nghiên cứu');
  if(!hyp.length&&quant) anomalies.push('Nghiên cứu định lượng nhưng không tìm thấy giả thuyết dạng H1, H2…');
  if(nums.length>=2) anomalies.push('Bài nêu nhiều con số cỡ mẫu khác nhau ('+nums.join(', ')+') — kiểm tra cỡ mẫu cuối cùng');
  const noRes=hyp.filter(h=>!HR[h.k]).map(h=>h.k);if(noRes.length) anomalies.push('Không tìm thấy kết quả kiểm định cho: '+noRes.join(', ')+' — đọc bảng kết quả để bổ sung');
  const rej=hyp.filter(h=>HR[h.k]?.neg).map(h=>h.k);if(rej.length) anomalies.push('Giả thuyết bị bác bỏ / không có ý nghĩa: '+rej.join(', '));
  hyp.forEach(h=>{if(HR[h.k]?.warn) anomalies.push(`${h.k}: ${HR[h.k].warn}`)});
  const mis=hyp.filter(h=>{const r=HR[h.k];return r&&r.beta!=null&&h.sign&&!r.neg&&((h.sign==='(+)'&&r.beta<0)||(h.sign==='(−)'&&r.beta>0))}).map(h=>h.k);
  if(mis.length) anomalies.push('Dấu hệ số ngược với chiều giả thuyết nhưng vẫn ghi “ủng hộ”: '+mis.join(', ')+' — kiểm tra lại');
  anomalies.unshift('[Mức đọc: toàn văn PDF, trích tự động — không dùng AI]');
  R.anomalies={value:anomalies.length>1?anomalies.map((a,i)=>i?'• '+a:a).join('\n'):anomalies[0]+'\nKhông phát hiện điểm bất thường theo quy tắc tự động.',page:'',quote:'',flag:anomalies.length>1?'anomalous':''};
  R.summary=trunc(absText,1600)+(kwLine?`\n\nTừ khóa: ${kwLine}`:'');
  return R;
}

async function analyzePaper(p){
  if(S.mode!=='ai') return analyzeRule(p);
  const blob=await downloadPdf(p);
  const pages=await extractPages(await blob.arrayBuffer());
  const npages=pages.map(norm);
  const chars=npages.join('').length;
  const scanned=chars<pages.length*200;
  const inline=blob.size<=14*1024*1024;
  if(!inline&&scanned) throw new AppErr('File >14MB và là PDF dạng ảnh — gói miễn phí không xử lý được. Hãy nén file rồi tải lại.');
  const text=inline?'':'Article text (file too large to attach). Page markers "=== Trang N ===" give PDF page numbers.\n\n'+pages.map((t,i)=>`=== Trang ${i+1} ===\n${t}`).join('\n\n');
  const ai=await callAI({system:SYS_EXTRACT,pdfB64:inline?await blobToB64(blob):null,filename:p.file_name,text,prompt:'Extract the fields from this article.',schema:EXTRACT_SCHEMA});
  return {fields:buildFields(ai,p,npages,scanned),summary:String(ai.summary||'').trim(),page_count:pages.length};
}
async function analyzeRule(p){
  const blob=await downloadPdf(p);
  const {pages,p1}=await extractDocFull(await blob.arrayBuffer());
  const npages=pages.map(norm);
  if(npages.join('').length<pages.length*200) throw new AppErr('PDF dạng ảnh (scan) — chế độ không dùng AI không đọc được chữ. Hãy dùng bản PDF có chữ, hoặc bật chế độ AI trong Cài đặt rồi phân tích lại bài này.');
  const r=await ruleExtract(pages,p1,S.crossref!==false);
  return {fields:buildFields(r,p,npages,false,'auto'),summary:r.summary,page_count:pages.length};
}

// ---------- hàng đợi ----------
async function runQueue(){
  if(Q.running) return;
  if(S.mode==='ai'&&!aiKey()){Q.paused=true;Q.pauseReason=`Chưa có ${PROVIDER_NAME[S.provider]} API key — vào Cài đặt để nhập, hoặc chuyển sang chế độ Không dùng AI.`;renderQueueBox();return}
  Q.running=true;Q.paused=false;Q.pauseReason='';clearTimeout(Q.resumeTimer);renderQueueBox();
  try{
    while(!Q.paused){
      const next=allSorted().find(p=>p.status==='queued');
      if(!next) break;
      await processPaper(next);
      if(!Q.paused&&state.papers.some(p=>p.status==='queued')) await sleep(S.mode==='ai'?Math.max(0,S.delaySec)*1000:50);
    }
  }finally{Q.running=false;Q.current=null;refresh()}
}
async function processPaper(p){
  Q.current=p.id;
  const attempts=(p.attempts||0)+1;
  try{
    if(!await patchPaper(p.id,{status:'processing',error:null,attempts})) return;
    refresh();
    const r=await analyzePaper(getPaper(p.id)||p);
    if(!getPaper(p.id)) return;
    await patchPaper(p.id,{status:'done',fields:r.fields,summary:r.summary,page_count:r.page_count,ai_model:S.mode==='ai'?aiLabel():'Tự động (không AI)',analyzed_at:new Date().toISOString(),error:null,overwrite_all:false});
    try{if(await autoClassify(getPaper(p.id)))renderFolders()}catch(e){console.warn('autoClassify',e)}
  }catch(e){
    console.error(e);
    try{
      if(e.pause){
        Q.paused=true;Q.pauseReason=e.message;
        await patchPaper(p.id,{status:'queued',attempts:attempts-1});
        if(e.daily) Q.resumeTimer=setTimeout(()=>runQueue(),30*60*1000);
      }else if(e.retry&&attempts<3){
        await patchPaper(p.id,{status:'queued',error:e.message});await sleep(15000);
      }else{
        await patchPaper(p.id,{status:'failed',error:e.message||String(e)});
      }
    }catch(e2){toast('Lỗi cập nhật trạng thái: '+e2.message,'error')}
  }finally{Q.current=null;refresh()}
}
function pauseQueue(){Q.paused=true;Q.pauseReason='Đã tạm dừng — bài đang xử lý sẽ hoàn tất.';renderQueueBox()}

async function uploadFiles(fileList){
  const all=[...fileList];
  const files=all.filter(f=>f.type==='application/pdf'||/\.pdf$/i.test(f.name));
  if(all.length>files.length) toast(`Bỏ qua ${all.length-files.length} file không phải PDF.`);
  const big=files.filter(f=>f.size>50*1024*1024);
  let todo=files.filter(f=>f.size<=50*1024*1024);
  if(big.length) toast(`Bỏ qua ${big.length} file lớn hơn 50MB.`,'error');
  const names=new Set(state.papers.map(p=>p.file_name));
  const dup=todo.filter(f=>names.has(f.name));
  if(dup.length){
    const v=await modal({title:'File đã tồn tại',body:`${dup.length} file trùng tên với bài đã có (ví dụ: <i>${esc(dup[0].name)}</i>).`,buttons:[{label:'Hủy',value:null},{label:'Bỏ qua file trùng',value:'skip',kind:'primary'},{label:'Vẫn tải lên',value:'all'}]});
    if(!v) return;
    if(v==='skip') todo=todo.filter(f=>!names.has(f.name));
  }
  if(!todo.length) return;
  const prog=()=>$('#upProg');
  let done=0;const fails=[];
  const show=()=>{const el=prog();if(el) el.innerHTML=`<div class="card" style="margin-top:12px"><div class="row"><b>Đang tải lên ${done}/${todo.length}</b>${done<todo.length?'<span class="spin"></span>':''}</div><div class="bar" style="margin:8px 0"><span style="width:${done/todo.length*100}%"></span></div>${fails.length?`<div class="err">Lỗi: ${fails.map(x=>esc(x)).join('<br>')}</div>`:''}</div>`};
  show();
  let idx=0;
  const worker=async()=>{
    while(idx<todo.length){
      const f=todo[idx++];
      try{
        const id=crypto.randomUUID(),path=`${user.id}/${id}.pdf`;
        const up=await sb.storage.from(CONFIG.BUCKET).upload(path,f,{contentType:'application/pdf',upsert:false});
        if(up.error) throw up.error;
        const {rank,no}=parseFileName(f.name);
        const fields=rank?{rank:{value:rank,page:'',quote:'',flag:'',source:'verified',note:'Lấy từ tên file'}}:{};
        const {data,error}=await sb.from('papers').insert({id,file_name:f.name,file_no:no,storage_path:path,file_size:f.size,fields}).select().single();
        if(error){await sb.storage.from(CONFIG.BUCKET).remove([path]);throw error}
        state.papers.push(data);
        if(state.folder&&folderById(state.folder)) await linkPaper(data.id,state.folder,false).catch(e=>console.warn(e));
      }catch(e){fails.push(`${f.name}: ${e.message||e}`)}
      done++;show();renderUploadList();renderQueueBox();
    }
  };
  await Promise.all([worker(),worker(),worker()]);
  renderFolders();
  toast(`Đã tải lên ${todo.length-fails.length}/${todo.length} file${state.folder?` vào “${scopeName()}”`:''}.`,fails.length?'error':'ok');
  if(!fails.length) setTimeout(()=>{const el=prog();if(el&&!el.querySelector('.err'))el.innerHTML=''},4000);
  runQueue();
}
async function deletePapers(ids){
  ids=ids.filter(id=>id!==Q.current);
  if(!ids.length) return toast('Không thể xóa bài đang được phân tích.');
  if(!await confirmBox('Xóa bài báo?',`Sẽ xóa vĩnh viễn <b>${ids.length}</b> bài: file PDF và toàn bộ dữ liệu phân tích. Không thể hoàn tác.`,'Xóa vĩnh viễn','danger')) return false;
  let ok=0;
  for(const id of ids){
    const p=getPaper(id);if(!p) continue;
    const r1=await sb.storage.from(CONFIG.BUCKET).remove([p.storage_path]);
    if(r1.error){toast(`Không xóa được file ${p.file_name}: ${r1.error.message}`,'error');continue}
    const r2=await sb.from('papers').delete().eq('id',id);
    if(r2.error){toast(`Không xóa được dữ liệu ${p.file_name}: ${r2.error.message}`,'error');continue}
    state.papers=state.papers.filter(x=>x.id!==id);state.links=state.links.filter(l=>l.paper_id!==id);state.selected.delete(id);pdfCache.delete(id);ok++;
  }
  saveSel();renderFolders();toast(`Đã xóa ${ok} bài.`,'ok');refresh();return true;
}
async function reanalyzePapers(ids){
  ids=ids.filter(id=>getPaper(id)&&getPaper(id).status!=='processing');
  if(!ids.length) return;
  const prot=ids.some(id=>Object.entries(getPaper(id).fields||{}).some(([k,v])=>k!=='rank'&&(v.source==='edited'||v.source==='verified')));
  let overwrite=false;
  if(prot){

async function renderV(){
  const canvas=$('#vCanvas'),wrap=$('#vScroll');if(!canvas||!V.doc) return;
  V.page=Math.min(Math.max(1,V.page),V.doc.numPages);
  $('#vPage').textContent=`Trang ${V.page} / ${V.doc.numPages}`;
  const token=V.token=(V.token||0)+1;
  const page=await V.doc.getPage(V.page);
  const base=page.getViewport({scale:1});
  const scale=Math.max(.3,(wrap.clientWidth-18)/base.width)*V.zoom;
  const vp=page.getViewport({scale}),dpr=window.devicePixelRatio||1;
  // vẽ ra canvas riêng rồi mới chép lên màn hình — tránh 2 lần vẽ chồng nhau
  const off=document.createElement('canvas');
  off.width=Math.floor(vp.width*dpr);off.height=Math.floor(vp.height*dpr);
  try{await page.render({canvasContext:off.getContext('2d'),viewport:vp,transform:dpr!==1?[dpr,0,0,dpr,0,0]:undefined}).promise}catch(e){return}
  if(token!==V.token||!document.body.contains(canvas)) return;
  canvas.width=off.width;canvas.height=off.height;
  canvas.style.width=Math.floor(vp.width)+'px';canvas.style.height=Math.floor(vp.height)+'px';
  const ctx=canvas.getContext('2d');ctx.drawImage(off,0,0);
  wrap.scrollTop=0;
  if(V.quote){
    const nq=norm(V.quote);if(nq.length<6) return;
    const tc=await page.getTextContent();
    ctx.setTransform(dpr,0,0,dpr,0,0);ctx.fillStyle=getComputedStyle(document.documentElement).getPropertyValue('--hl')||'rgba(255,200,0,.38)';
    let firstY=null;
    for(const it of tc.items){
      const s=norm(it.str);if(s.length<6) continue;
      let hit=nq.includes(s)&&s.length>=12||s.includes(nq);
      if(!hit){const w=s.split(' ');if(w.length>=3){let h=0,t=0;for(let i=0;i+3<=w.length;i++){t++;if(nq.includes(w.slice(i,i+3).join(' ')))h++}hit=h/t>=0.35}}
      if(hit){
        const tx=pdfjsLib.Util.transform(vp.transform,it.transform);
        const h=Math.hypot(tx[2],tx[3]);const x=tx[4],y=tx[5]-h;
        ctx.fillRect(x-1,y-1,it.width*scale+2,h+3);
        if(firstY==null||y<firstY) firstY=y;
      }
    }
    if(firstY!=null) wrap.scrollTop=Math.max(0,firstY-80);
  }
}

function editCell(td){
  if(td.querySelector('textarea')) return;
  const p=getPaper(td.dataset.id),k=td.dataset.k;
  if(p.status==='processing') return toast('Bài đang được phân tích, chờ xong rồi sửa.');
  const old=p.fields?.[k]?.value||'';
  state.editing=true;
  td.innerHTML=`<textarea class="cell-edit">${esc(old)}</textarea>`;
  const ta=td.querySelector('textarea');ta.focus();ta.setSelectionRange(ta.value.length,ta.value.length);
  let cancel=false;
  ta.addEventListener('keydown',e=>{if(e.key==='Escape'){cancel=true;ta.blur()}if(e.key==='Enter'&&(e.ctrlKey||e.metaKey)){e.preventDefault();ta.blur()}});
  ta.addEventListener('blur',()=>{
    const val=ta.value.trim();
    if(!cancel&&val!==old.trim()) setField(p,k,{value:val,source:'edited',flag:''});
    state.editing=false;td.className='c '+cellCls(p,k);td.innerHTML=cellInner(p,k);
  });
}

// ---------- Tổng hợp nhanh không dùng AI ----------
function splitItems(v){
  if(!v||isNA(v)||/^Từ khóa của bài|^Bài có nhắc|^Câu trong bài|^Không phát hiện/i.test(v)) return [];
  return String(v).split(/\n|;|•/).map(s=>s.replace(/\(.*?\)/g,'').replace(/^(Quốc gia|Lĩnh vực\/đối tượng|Phân tích|Chọn mẫu|Cỡ mẫu.*?)\s*:\s*/i,'').trim()).filter(s=>s.length>1&&s.length<90);
}
function tally(papers,getItems){
  const m=new Map();
  papers.forEach((p,i)=>{const seen=new Set();for(const it of getItems(p)){const k=it.toLowerCase();if(seen.has(k))continue;seen.add(k);if(!m.has(k))m.set(k,{name:it,ids:[]});m.get(k).ids.push(i+1)}});
  return [...m.values()].sort((a,b)=>b.ids.length-a.ids.length||a.name.localeCompare(b.name));
}
const dictItems=(dict,text)=>dict.filter(([,re])=>re.test(text)).map(x=>x[0]);
function mdTable(rows,n,label,limit=25){
  if(!rows.length) return '_Chưa có dữ liệu._\n';
  return `| ${label} | Số bài | % | Bài |\n|---|---|---|---|\n`+rows.slice(0,limit).map(r=>`| ${r.name.replace(/\|/g,'/')} | ${r.ids.length} | ${Math.round(r.ids.length/n*100)}% | ${r.ids.map(i=>'['+i+']').join(' ')} |`).join('\n')+(rows.length>limit?`\n\n_…và ${rows.length-limit} mục khác._`:'')+'\n';
}
function quickSynthesis(papers){
  const n=papers.length,L=[];
  const years=papers.map(p=>parseInt(fv(p,'year'))).filter(y=>y>1900);
  const theory=tally(papers,p=>splitItems(fv(p,'theory')));
  const vars={iv:tally(papers,p=>splitItems(fv(p,'iv'))),med:tally(papers,p=>splitItems(fv(p,'med'))),mod:tally(papers,p=>splitItems(fv(p,'mod'))),dv:tally(papers,p=>splitItems(fv(p,'dv')))};
  const tech=tally(papers,p=>dictItems(ANALYSIS,fv(p,'design')));
  const appr=tally(papers,p=>dictItems([['Định lượng',/định lượng|quantitative/i],['Định tính',/định tính|qualitative/i],['Hỗn hợp',/hỗn hợp|mixed/i]],fv(p,'design')));
  const ctry=tally(papers,p=>COUNTRIES.filter(c=>new RegExp('\\b'+c+'\\b','i').test(fv(p,'context'))));
  const sect=tally(papers,p=>dictItems(SECTORS,fv(p,'context')));
  const lik=tally(papers,p=>{const m=fv(p,'scales').match(/Likert\s*(\d+)|(\d+)[- ]point/i);return m?['Likert '+(m[1]||m[2])+' điểm']:[]});
  const samples=papers.map(p=>{const m=fv(p,'design').match(/Cỡ mẫu[^:]*:\s*([\d,; ]+)/i)||fv(p,'design').match(/\b(\d{2,6})\b/);if(!m)return null;const ns=m[1].split(/[;\s]+/).map(x=>parseInt(x.replace(/,/g,''))).filter(Boolean);return ns.length?Math.min(...ns):null}).filter(Boolean);
  const rank=tally(papers,p=>fv(p,'rank')?[fv(p,'rank')]:[]);
  L.push(`## 1. Tổng quan tập bài báo\n- Số bài: **${n}**${years.length?` · Năm xuất bản: **${Math.min(...years)}–${Math.max(...years)}**`:''}\n- Xếp hạng tạp chí: ${rank.length?rank.map(r=>`${r.name}: ${r.ids.length}`).join(' · '):'chưa có'}\n- Cách tiếp cận: ${appr.length?appr.map(r=>`${r.name}: ${r.ids.length}`).join(' · '):'chưa xác định'}\n`);
  if(years.length){const yc={};years.forEach(y=>yc[y]=(yc[y]||0)+1);L.push('| Năm | Số bài |\n|---|---|\n'+Object.keys(yc).sort().map(y=>`| ${y} | ${yc[y]} |`).join('\n')+'\n')}
  L.push(`## 2. Lý thuyết nền tảng (theoretical foundations)\n`+mdTable(theory,n,'Lý thuyết'));
  L.push(`## 3. Biến nghiên cứu (research variables)\n### Biến độc lập (independent variables)\n${mdTable(vars.iv,n,'Biến')}\n### Biến trung gian (mediators)\n${mdTable(vars.med,n,'Biến')}\n### Biến điều tiết (moderators)\n${mdTable(vars.mod,n,'Biến')}\n### Biến phụ thuộc (dependent variables)\n${mdTable(vars.dv,n,'Biến')}`);
  L.push(`## 4. Phương pháp (methods)\n${mdTable(tech,n,'Kỹ thuật phân tích')}${samples.length?`\n- Cỡ mẫu: nhỏ nhất **${Math.min(...samples)}**, lớn nhất **${Math.max(...samples)}**, trung vị **${samples.sort((a,b)=>a-b)[Math.floor(samples.length/2)]}** (từ ${samples.length} bài có số liệu)\n`:''}`);
  L.push(`## 5. Bối cảnh nghiên cứu (research context)\n### Quốc gia\n${mdTable(ctry,n,'Quốc gia')}\n### Lĩnh vực / đối tượng\n${mdTable(sect,n,'Lĩnh vực')}`);
  L.push(`## 6. Thang đo (measurement scales)\n${mdTable(lik,n,'Loại thang đo')}`);
  const common=[['Lý thuyết',theory],['Biến độc lập',vars.iv],['Biến phụ thuộc',vars.dv],['Kỹ thuật',tech],['Quốc gia',ctry]].flatMap(([g,rows])=>rows.filter(r=>n>=2&&r.ids.length>=Math.max(2,Math.ceil(n*0.5))).map(r=>`- **${g}**: ${r.name} — ${r.ids.length}/${n} bài`));
  L.push(`## 7. Điểm tương đồng (similarities)\n_Các mục xuất hiện ở ≥ 50% số bài._\n${common.length?common.join('\n'):'- Không có mục nào chung cho phần lớn các bài.'}\n`);
  const rare=[['Lý thuyết',theory],['Biến trung gian',vars.med],['Biến điều tiết',vars.mod],['Quốc gia',ctry],['Kỹ thuật',tech]].flatMap(([g,rows])=>rows.filter(r=>r.ids.length===1).slice(0,8).map(r=>`- **${g}**: ${r.name} — chỉ có ở [${r.ids[0]}]`));
  L.push(`## 8. Điểm khác biệt (differences)\n_Các mục chỉ xuất hiện ở 1 bài._\n${rare.length?rare.join('\n'):'- Không có.'}\n`);
  const contra=[];papers.forEach((p,i)=>{const f=fv(p,'findings');const hits=f.split('\n').filter(s=>/not supported|rejected|insignificant|non-significant|not significant|no significant/i.test(s));hits.forEach(h=>contra.push(`- [${i+1}] ${h.replace(/^•\s*/,'').slice(0,300)}`))});
  L.push(`## 9. Kết quả không ủng hộ / có thể mâu thuẫn (contradictions)\n_Các câu kết quả có “not supported / rejected / not significant” — so sánh với bài khác có cùng mối quan hệ để xác định mâu thuẫn._\n${contra.length?contra.join('\n'):'- Không tìm thấy giả thuyết bị bác bỏ trong dữ liệu.'}\n`);
  const gaps=[];
  if(!vars.mod.length) gaps.push('- Chưa bài nào dùng **biến điều tiết (moderator)** → có thể bổ sung trong mô hình luận văn.');
  else if(vars.mod.length&&vars.mod.every(r=>r.ids.length<=1)) gaps.push('- **Biến điều tiết** được dùng rất ít và không lặp lại giữa các bài.');
  if(!vars.med.length) gaps.push('- Chưa bài nào dùng **biến trung gian (mediator)**.');
  if(appr.length&&!appr.some(r=>/Định tính|Hỗn hợp/.test(r.name))) gaps.push('- Chưa có nghiên cứu **định tính / hỗn hợp** → khoảng trống về phương pháp.');
  if(ctry.length) gaps.push(`- Bối cảnh tập trung ở: ${ctry.slice(0,3).map(r=>r.name+' ('+r.ids.length+')').join(', ')}. ${ctry.some(r=>/Vietnam|Viet Nam/i.test(r.name))?'':'**Chưa có bài nào tại Việt Nam** → khoảng trống bối cảnh.'}`);
  if(theory.length===1) gaps.push(`- Chỉ dùng một lý thuyết (**${theory[0].name}**) → có thể kết hợp thêm lý thuyết khác.`);
  const lims=papers.map((p,i)=>[i+1,fv(p,'limitations')]).filter(x=>x[1]&&!isNA(x[1]));
  if(lims.length) gaps.push(`- Hạn chế do các tác giả tự nêu (gợi ý hướng nghiên cứu): xem mục "Hạn chế nghiên cứu" của các bài ${lims.slice(0,12).map(x=>'['+x[0]+']').join(' ')}.`);
  L.push(`## 10. Gợi ý khoảng trống nghiên cứu (research gaps)\n_Gợi ý tự động dựa trên tần suất — cần bạn đánh giá lại._\n${gaps.length?gaps.join('\n'):'- Không có gợi ý.'}\n`);
  return L.join('\n');
}
async function runQuick(){
  const papers=sortedPapers().filter(p=>p.status==='done'&&state.selected.has(p.id));
  if(papers.length<2) return toast('Hãy chọn ít nhất 2 bài đã phân tích.');
  let md=quickSynthesis(papers);
  md+=`\n\n## Danh sách bài báo\n`+papers.map((p,i)=>`[${i+1}] ${fv(p,'author_year')&&!isNA(fv(p,'author_year'))?fv(p,'author_year'):p.file_name} — ${titleOf(p)}`).join('\n\n');
  const {data:row,error}=await sb.from('reports').insert(cleanDeep({title:`Tổng hợp nhanh ${papers.length} bài báo – ${new Date().toLocaleDateString('vi-VN')}`,paper_ids:papers.map(p=>p.id),content:md,ai_model:'Tổng hợp tự động (không AI)'})).select().single();
  if(error) return toast('Không lưu được báo cáo: '+error.message,'error');
  state.reports.unshift(row);location.hash='#/compare/'+row.id;
}
async function runCompare(){
  if(!aiKey()) return toast(`So sánh bằng AI cần ${PROVIDER_NAME[S.provider]} API key (Cài đặt). Dùng “Tổng hợp nhanh” để không cần AI.`,'error');
  const papers=sortedPapers().filter(p=>p.status==='done'&&state.selected.has(p.id));
  if(papers.length<2) return toast('Hãy chọn ít nhất 2 bài đã phân tích.');
  if(papers.length>80&&!await confirmBox('Nhiều bài báo',`Bạn chọn ${papers.length} bài — có thể vượt giới hạn gói miễn phí. Vẫn tiếp tục?`)) return;
  state.comparing=true;renderCompare();
  try{
    const data=papers.map((p,i)=>`[${i+1}] ${titleOf(p)}\n`+CMP_KEYS.map(k=>`- ${FMAP[k].label}: ${trunc(fv(p,k)||NA,1500)}`).join('\n')).join('\n\n');
    let md=await callAI({system:SYS_COMPARE,text:data});
    md=md.replace(/^```(?:markdown|md)?\s*/i,'').replace(/```\s*$/,'').trim();
    md+=`\n\n## Danh sách bài báo\n`+papers.map((p,i)=>`[${i+1}] ${fv(p,'author_year')||''} — ${fv(p,'title')||p.file_name}`).join('\n\n');
    const {data:row,error}=await sb.from('reports').insert(cleanDeep({title:`So sánh ${papers.length} bài báo – ${new Date().toLocaleDateString('vi-VN')}`,paper_ids:papers.map(p=>p.id),content:md,ai_model:aiLabel()})).select().single();
    if(error) throw error;
    state.reports.unshift(row);state.comparing=false;location.hash='#/compare/'+row.id;
  }catch(e){state.comparing=false;toast('Không tạo được báo cáo: '+e.message,'error');if(curRoute().page==='compare')renderCompare()}
}

function idbOpen(){

    r.onupgradeneeded=()=>{const db=r.result;for(const t of LOCAL_TABLES) if(!db.objectStoreNames.contains(t)) db.createObjectStore(t,{keyPath:'_k'});

        else if(op==='update'){const puts=T[table].filter(m).map(r=>({...r,...clone(payload),updated_at:now}));
          await idbWrite(db,table,puts);for(const n of puts){const i=T[table].findIndex(x=>lkey(table,x)===lkey(table,n));T[table][i]=n}out=puts.map(clone);bumpChanges()}
        else if(op==='delete'){out=T[table].filter(m);await idbWrite(db,table,[],out);T[table]=T[table].filter(r=>!m(r));

          if(table==='papers'){const gone=new Set(out.map(r=>r.id)),ld=T.paper_folders.filter(l=>gone.has(l.paper_id));await idbWrite(db,'paper_folders',[],ld);T.paper_folders=T.paper_folders.filter(l=>!gone.has(l.paper_id))}

    storage:{from(){return{
      upload:async(path,file)=>{try{await idbFile(db,'put',path,file);return {data:{path},error:null}}catch(e){return {data:null,error:{message:e.message}}}},
      download:async path=>{try{const b=await idbFile(db,'get',path);return b?{data:b,error:null}:{data:null,error:{message:'Không thấy file PDF trên máy này'}}}catch(e){return {data:null,error:{message:e.message}}}},
      remove:async paths=>{try{for(const p of paths) await idbFile(db,'delete',p);return {data:[],error:null}}catch(e){return {data:null,error:{message:e.message}}}},
      createSignedUrl:async path=>{const b=await idbFile(db,'get',path).catch(()=>null);if(!b)return {data:null,error:{message:'Không thấy file PDF trên máy này'}};
        if(blobUrls.has(path))URL.revokeObjectURL(blobUrls.get(path));const u=URL.createObjectURL(new Blob([b],{type:'application/pdf'}));blobUrls.set(path,u);return {data:{signedUrl:u},error:null}},
    }}},
  };
}

// ---------- Sao lưu / Khôi phục (file .zip) ----------
async function backupLocal(){
  if(!sb?._local) return;
  const T=sb._T,zip=new JSZip();
  zip.file('data.json',JSON.stringify({app:'tro-ly-tong-quan-tai-lieu',version:APP_VERSION,exported_at:new Date().toISOString(),tables:T}));
  let n=0;
  for(const p of T.papers){const b=await idbFile(sb._db,'get',p.storage_path).catch(()=>null);if(b){zip.file('files/'+p.storage_path,b,{binary:true,compression:'STORE'});n++}}
  toast('Đang nén file sao lưu…');
  const blob=await zip.generateAsync({type:'blob'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=`Sao_luu_Tro_ly_${new Date().toISOString().slice(0,10)}.zip`;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),10000);
  store.set('lr.backupAt',Date.now());store.set('lr.changes',0);renderBackupBox();
  toast(`Đã sao lưu ${T.papers.length} bài (${n} file PDF), ${T.folders.length} thư mục, ${T.reports.length} báo cáo.`,'ok');
}
async function importIntoLocal(tables,getFile,replace,onProgress=()=>{}){
  const db=sb?._local?sb._db:await idbOpen();
  if(replace){for(const t of LOCAL_TABLES){const all=(await idbReq(db.transaction(t).objectStore(t).getAll()));await idbWrite(db,t,[],all)}
    await new Promise((res,rej)=>{const tx=db.transaction('files','readwrite');tx.objectStore('files').clear();tx.oncomplete=res;tx.onerror=()=>rej(tx.error)})}
  for(const t of LOCAL_TABLES){const rows=(tables[t]||[]).map(cleanDeep);for(let i=0;i<rows.length;i+=200) await idbWrite(db,t,rows.slice(i,i+200))}
  const papers=tables.papers||[];let ok=0,miss=[];
  for(let i=0;i<papers.length;i++){const p=papers[i];onProgress(i+1,papers.length,p.file_name);
    try{const b=await getFile(p);if(b){await idbFile(db,'put',p.storage_path,b);ok++}else miss.push(p.file_name)}catch(e){miss.push(p.file_name)}}
  return {ok,miss};
}
async function restoreLocal(file){
  let zip;try{zip=await JSZip.loadAsync(file)}catch{return toast('File không phải bản sao lưu .zip hợp lệ.','error')}
  const dj=zip.file('data.json');if(!dj) return toast('Không thấy data.json trong file sao lưu.','error');
  let data;try{data=JSON.parse(await dj.async('string'))}catch{return toast('data.json bị hỏng.','error')}
  const T=data.tables||{};
  const v=await modal({title:'Khôi phục từ bản sao lưu',body:`Bản sao lưu ngày <b>${esc(fmtDate(data.exported_at))}</b>: ${(T.papers||[]).length} bài, ${(T.folders||[]).length} thư mục, ${(T.reports||[]).length} báo cáo.<br><br><b>Gộp</b>: thêm vào dữ liệu hiện tại (bài trùng sẽ được thay bằng bản trong file). <b>Thay thế</b>: xóa dữ liệu hiện tại trên máy rồi khôi phục.`,
    buttons:[{label:'Hủy',value:null},{label:'Thay thế toàn bộ',value:'replace',kind:'danger'},{label:'Gộp (khuyên dùng)',value:'merge',kind:'primary'}]});
  if(!v) return;
  showProgress('Đang khôi phục…');
  const r=await importIntoLocal(T,p=>zip.file('files/'+p.storage_path)?.async('blob'),v==='replace',(i,n,f)=>showProgress(`Đang khôi phục ${i}/${n}: ${f}`));
  store.set('lr.backupAt',Date.now());store.set('lr.changes',0);
  hideProgress();await modal({title:'Đã khôi phục',body:`Khôi phục ${(T.papers||[]).length} bài (${r.ok} file PDF).${r.miss.length?`<br>Thiếu PDF: ${r.miss.slice(0,10).map(esc).join(', ')}${r.miss.length>10?'…':''}`:''}`,buttons:[{label:'Tải lại trang',value:1,kind:'primary'}]});
  location.reload();
}
// Chuyển toàn bộ dữ liệu từ Supabase về máy này
async function migrateSupabaseToLocal(src){
  showProgress('Đang đọc dữ liệu từ Supabase…');
  const get=async t=>{const {data,error}=await src.from(t).select('*').limit(20000);if(error){if(t==='folders'||t==='paper_folders')return [];throw error}return data||[]};
  const tables={};for(const t of LOCAL_TABLES) tables[t]=await get(t);
  const r=await importIntoLocal(tables,async p=>{const {data}=await src.storage.from(CONFIG.BUCKET).download(p.storage_path);return data||null},false,(i,n,f)=>showProgress(`Đang tải PDF ${i}/${n}: ${f}`));
  hideProgress();return {tables,...r};
}

function hideProgress(){$('#bigprog')?.remove()}
async function storageInfo(){try{const e=await navigator.storage.estimate();const persisted=await navigator.storage.persisted?.();return `Đang dùng ${(e.usage/1048576).toFixed(1)} MB / tối đa khoảng ${(e.quota/1073741824).toFixed(1)} GB${persisted?' · đã bật lưu bền vững':''}`}catch{return ''}}
function backupDue(){

async function testSupabase(url,key){
  url=normSupabaseUrl(url);key=String(key||'').trim();
  if(!/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)$/i.test(url)) return {ok:false,msg:`URL "${url}" không đúng dạng https://xxxx.supabase.co`};
  if(!key) return {ok:false,msg:'Chưa nhập anon key.'};
  try{
    const r=await fetch(url+'/auth/v1/settings',{headers:{apikey:key,Authorization:'Bearer '+key}});
    if(r.ok) return {ok:true,url,msg:'✓ Kết nối thành công tới '+url};
    const d=await r.json().catch(()=>({}));
    return {ok:false,msg:`Supabase trả lỗi ${r.status}: ${d.message||d.msg||d.error||r.statusText}. ${r.status===401?'Anon key sai.':''}`};
  }catch(e){return {ok:false,msg:'Không kết nối được tới '+url+' — kiểm tra lại Project URL. ('+e.message+')'}}
}
function authErr(e){
  const m=e?.message||String(e);
  if(/invalid path|failed to fetch|invalid api key|no api key/i.test(m))
    return `Lỗi kết nối Supabase (${m}). Bấm "Cấu hình kết nối Supabase" bên dưới để nhập lại Project URL (dạng https://xxxx.supabase.co) và anon key.`;
  if(/invalid login credentials/i.test(m)) return 'Sai email hoặc mật khẩu. Nếu chưa có tài khoản, bấm "Tạo tài khoản".';
  if(/email not confirmed/i.test(m)) return 'Email chưa được xác nhận. Mở hộp thư, bấm link xác nhận rồi đăng nhập lại.';
  if(/signups? not allowed/i.test(m)) return 'Đăng ký tài khoản mới đang bị tắt trong Supabase.';
  return 'Lỗi: '+m;
}

  selRow:a=>{a.checked?state.selected.add(a.dataset.id):state.selected.delete(a.dataset.id);saveSel();$$('.selN').forEach(x=>x.textContent=a.closest('#clist')?[...state.selected].filter(id=>getPaper(id)?.status==='done').length:state.selected.size);const u=$('#uSelInfo');if(u){const n=uploadVisible().filter(p=>state.selected.has(p.id)).length;u.textContent=n?`Đã chọn ${n}`:''}},
  selAll:a=>{const list=a.dataset.scope==='upload'?uploadVisible():tableVisible();list.forEach(p=>a.checked?state.selected.add(p.id):state.selected.delete(p.id));saveSel();a.dataset.scope==='upload'?renderUploadList():renderTableBody()},
  cmpAll:a=>{$$('#clist .li').forEach(l=>{if(l.hidden)return;const c=l.querySelector('input');c.checked=a.dataset.v==='1';c.checked?state.selected.add(c.dataset.id):state.selected.delete(c.dataset.id)});saveSel();$$('.selN').forEach(x=>x.textContent=[...state.selected].filter(id=>getPaper(id)?.status==='done').length)},
  openPdf:async a=>{
    const p=getPaper(a.dataset.id);const w=window.open('','_blank');
    const {data,error}=await sb.storage.from(CONFIG.BUCKET).createSignedUrl(p.storage_path,3600);
    if(error){w&&w.close();return toast('Không mở được PDF: '+error.message,'error')}
    if(w) w.location=data.signedUrl;else location.href=data.signedUrl;
  },
  verifyField:a=>{const p=getPaper(a.dataset.id),k=a.dataset.k,v=p.fields?.[k];setField(p,k,{source:v?.source==='verified'?'edited':'verified'});updateFieldCard(p,k)},
  verifyAll:async a=>{const p=getPaper(a.dataset.id);if(!await confirmBox('Xác nhận tất cả?','Đánh dấu tất cả các trường của bài này là <b>đã kiểm tra và xác nhận</b>.'))return;
    const f={...(p.fields||{})};FIELDS.forEach(x=>f[x.k]={value:'',page:'',quote:'',flag:'',...(f[x.k]||{}),source:'verified'});p.fields=f;await saveFields(p);renderPaper(p.id);toast('Đã xác nhận tất cả.','ok')},
  fieldFilter:a=>{state.fieldFilter=a.dataset.f;$$('.chips .chip').forEach(c=>c.classList.toggle('on',c===a));applyFieldFilter()},
  gotoField:a=>{const p=getPaper(curRoute().id),v=p?.fields?.[a.dataset.k];if(v)gotoPdf(pageList(v.page)[0]||1,v.quote)},
  vPrev:()=>{if(V.doc){V.page--;V.quote='';renderV()}},
  vNext:()=>{if(V.doc){V.page++;V.quote='';renderV()}},
  vZoom:a=>{V.zoom=Math.min(3,Math.max(.5,V.zoom+(+a.dataset.z)*.25));renderV()},
  editCell:td=>editCell(td),
  verifyCell:a=>{const p=getPaper(a.dataset.id),k=a.dataset.k;if(p.status==='processing')return;const v=p.fields?.[k];setField(p,k,{source:v?.source==='verified'?'edited':'verified'});const td=a.closest('td');td.className='c '+cellCls(p,k);td.innerHTML=cellInner(p,k)},
  sortCol:a=>{const k=a.dataset.k;state.sort=state.sort.k===k?(state.sort.dir>0?{k,dir:-1}:{k:null,dir:1}):{k,dir:1};renderTableBody()},
  toggleCols:()=>{const p=$('#colpop');p.hidden=!p.hidden},
  colToggle:a=>{a.checked?state.hidden.delete(a.dataset.k):state.hidden.add(a.dataset.k);store.set('lr.hidden',[...state.hidden]);renderTableBody()},
  compareSel:()=>{location.hash='#/compare'},
  runCompare,runQuick,
  pickFolder:a=>{const id=a.dataset.id||null;if(state.folder===id)return;setFolder(id)},
  toggleFold:a=>{const id=a.dataset.id;state.foldOpen.has(id)?state.foldOpen.delete(id):state.foldOpen.add(id);store.set('lr.foldOpen',[...state.foldOpen]);renderFolders()},
  newFolder:async()=>{const name=await promptBox('Thư mục nghiên cứu mới','Tên hướng nghiên cứu (vd. “UBKT và tránh thuế”)');if(!name)return;const f=await createFolder(name);if(f){toast('Đã tạo thư mục. Tải bài lên hoặc kéo bài vào thư mục này.','ok');setFolder(f.id)}},
  folderMenu:async a=>{
    const f=folderById(a.dataset.id);if(!f)return;const top=!f.parent_id;
    const v=await modal({title:folderPath(f.id),body:top?'Thư mục hướng nghiên cứu. Bài thêm vào đây sẽ được tự xếp vào thư mục con theo chủ đề / biến phụ thuộc.':'Thư mục con'+(f.auto_key?' (hệ thống tạo theo chủ đề)':'')+'. Bài bạn tự chuyển vào đây sẽ được giữ cố định.',
      buttons:[{label:'Đóng',value:null},{label:'Xóa',value:'del',kind:'danger'},...(top?[{label:'Tự phân loại lại',value:'auto'},{label:'+ Thư mục con',value:'sub'}]:[]),{label:'Đổi tên',value:'ren',kind:'primary'}]});
    if(v==='ren') renameFolder(f.id);
    else if(v==='del') deleteFolder(f.id);
    else if(v==='sub'){const name=await promptBox('Thư mục con mới',`Trong “${f.name}”`);if(name){await createFolder(name,f.id);renderFolders()}}
    else if(v==='auto'){let n=0;for(const p of papersInFolder(f.id)) n+=await autoClassify(p).catch(()=>0);toast(n?`Đã xếp ${n} bài vào thư mục con.`:'Không có bài nào cần xếp lại (bài bạn tự xếp được giữ nguyên).','ok');renderFolders();route()}
  },
  bulkMove:async()=>{const ids=selectedInView();if(!ids.length)return toast('Chưa chọn bài nào.');const t=await folderPicker(`Chuyển ${ids.length} bài đến thư mục`,'Chuyển');if(t)placePapers(ids,t,'move')},
  bulkCopy:async()=>{const ids=selectedInView();if(!ids.length)return toast('Chưa chọn bài nào.');const t=await folderPicker(`Sao chép ${ids.length} bài vào thư mục`,'Sao chép');if(t)placePapers(ids,t,'copy')},
  bulkUnlink:()=>{const ids=selectedInView();if(!ids.length)return toast('Chưa chọn bài nào.');removeFromScope(ids)},
  unlinkOne:async a=>{await unlinkPaper(a.dataset.id,a.dataset.f).catch(e=>toast(e.message,'error'));renderFolders();renderDetailFolders(getPaper(a.dataset.id))},
  addOneFolder:async a=>{const t=await folderPicker('Thêm bài vào thư mục','Thêm');if(t){await placePapers([a.dataset.id],t,'copy')}},
  dlReport:a=>{const r=state.reports.find(x=>x.id===a.dataset.id);const b=new Blob(['# '+r.title+'\n\n'+r.content],{type:'text/markdown;charset=utf-8'});const l=document.createElement('a');l.href=URL.createObjectURL(b);l.download='bao_cao_so_sanh.md';l.click()},
  delReport:async a=>{if(!await confirmBox('Xóa báo cáo?','Báo cáo sẽ bị xóa vĩnh viễn.','Xóa','danger'))return;const {error}=await sb.from('reports').delete().eq('id',a.dataset.id);if(error)return toast(error.message,'error');state.reports=state.reports.filter(x=>x.id!==a.dataset.id);location.hash='#/compare'},
  doExport:async a=>{
    const done=sortedPapers().filter(p=>p.status==='done');const sc=state.exScope||'all';
    const list=sc==='sel'?done.filter(p=>state.selected.has(p.id)):sc==='full'?done.filter(p=>paperStats(p).full):done;
    const unv=list.filter(p=>!paperStats(p).full).length;
    if(unv&&!await confirmBox('Còn dữ liệu chưa xác nhận',`${unv} bài chưa được xác nhận đủ ${FIELDS.length} trường. Vẫn xuất Excel?`,'Vẫn xuất'))return;
    a.disabled=true;try{await exportExcel(list,{evidence:state.exEv!==false,summary:state.exSum!==false});toast('Đã xuất file Excel.','ok')}catch(e){toast('Lỗi xuất Excel: '+e.message,'error')}finally{a.disabled=false}
  },
  provPick:a=>{$('#provGemini').hidden=a.value==='openai';$('#provOpenai').hidden=a.value!=='openai'},
  checkOpenAI:async a=>{
    const key=$('#ok').value.trim();if(!key)return toast('Nhập OpenAI key trước.');a.disabled=true;
    try{const ms=await listOpenAIModels(key);if(!ms.length)throw new Error('Key không có model GPT nào khả dụng.');
      $('#oml').innerHTML=ms.map(m=>`<option value="${esc(m)}">`).join('');
      const cur=$('#om').value.trim();
      if(!ms.includes(cur)){const pick=pickOpenAIModel(ms);$('#om').value=pick;S.openaiKey=key;S.openaiModel=pick;saveSettings();toast(`Key hợp lệ. Model “${cur}” không có — đã chọn và lưu “${pick}”.`,'ok')}
      else toast(`Key hợp lệ — model “${cur}” dùng được (${ms.length} model khả dụng).`,'ok');
    }catch(e){toast('Key OpenAI không hợp lệ: '+e.message,'error')}finally{a.disabled=false}
  },
  toggleKey:a=>{const i=$('#'+(a.dataset.for||'gk'));i.type=i.type==='password'?'text':'password';a.textContent=i.type==='password'?'Hiện':'Ẩn'},
  saveSettings:()=>{S.mode=$('input[name=mode]:checked')?.value||'rule';S.crossref=$('#gcr').checked;S.provider=$('input[name=prov]:checked')?.value||'gemini';S.openaiKey=$('#ok').value.trim();S.openaiModel=$('#om').value.trim()||'gpt-4.1-mini';S.geminiKey=$('#gk').value.trim();S.model=$('#gm').value.trim()||CONFIG.DEFAULT_MODEL;S.delaySec=Math.max(0,+$('#gd').value||0);saveSettings();toast('Đã lưu cài đặt.','ok');
    if(state.papers.some(p=>p.status==='queued')){Q.paused=false;Q.pauseReason='';runQueue()}},
  checkKey:async a=>{
    const key=$('#gk').value.trim();if(!key)return toast('Nhập key trước.');a.disabled=true;
    try{const ms=await listGeminiModels(key);
      $('#gml').innerHTML=ms.map(m=>`<option value="${esc(m)}">`).join('');
      const cur=$('#gm').value.trim();
      if(!ms.includes(cur)){
        const pick=pickModel(ms);
        if(!pick) throw new Error('Key không có model Gemini nào khả dụng.');
        $('#gm').value=pick;S.geminiKey=key;S.model=pick;saveSettings();
        toast(`Key hợp lệ. Model “${cur}” không còn — đã chọn và lưu “${pick}”.`,'ok');
        if(state.papers.some(p=>p.status==='queued')){Q.paused=false;Q.pauseReason='';runQueue()}
      }
      else toast(`Key hợp lệ — model “${cur}” dùng được (${ms.length} model khả dụng).`,'ok');
    }catch(e){toast('Key không hợp lệ: '+e.message,'error')}finally{a.disabled=false}
  },
};
document.addEventListener('click',e=>{
  const a=e.target.closest('[data-act]');
  if(!a){const pop=$('#colpop');if(pop&&!pop.hidden&&!e.target.closest('.colmenu'))pop.hidden=true;return}
  if(a.tagName==='TD'&&e.target.closest('a,input,textarea')) return;
  const fn=ACT[a.dataset.act];if(fn) fn(a,e);
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.dataset.actChange==='folderSel'){setFolder(t.value||null);return}
  if(!t.dataset.input) return;
  const p=getPaper(t.dataset.id),k=t.dataset.k,key=t.dataset.input;if(!p) return;
  const val=t.value.trim(),cur=p.fields?.[k]||{};
  if((cur[key]||'')===val) return;
  const patch={[key]:val,source:'edited'};
  if(key==='value') patch.flag='';
  if(key==='quote') patch.quote_ok=null;
  setField(p,k,patch);updateFieldCard(p,k);
});
document.addEventListener('input',e=>{if(e.target.matches('textarea.fval,textarea.fquote'))autosize(e.target)});
window.addEventListener('hashchange',()=>{if(user)route()});
document.addEventListener('dragstart',e=>{
  const r=e.target.closest?.('[data-drag]');if(!r) return;
  const id=r.dataset.drag;const ids=state.selected.has(id)?selectedInView():[id];
  e.dataTransfer.setData('text/plain',JSON.stringify(ids));e.dataTransfer.effectAllowed='copyMove';
  document.body.classList.add('dragging');
});
const clearOver=except=>$$('.frow.over').forEach(x=>{if(x!==except)x.classList.toggle('over',false)});
document.addEventListener('dragend',()=>{document.body.classList.toggle('dragging',false);clearOver(null)});
document.addEventListener('dragover',e=>{const d=e.target.closest?.('[data-drop]');if(!d)return;e.preventDefault();e.dataTransfer.dropEffect=(e.ctrlKey||e.metaKey||e.altKey)?'copy':'move';clearOver(d);d.classList.add('over')});
document.addEventListener('dragleave',e=>{const d=e.target.closest?.('[data-drop]');if(d&&!d.contains(e.relatedTarget))d.classList.toggle('over',false)});
document.addEventListener('drop',e=>{
  const d=e.target.closest?.('[data-drop]');if(!d) return;e.preventDefault();d.classList.toggle('over',false);
  let ids=[];try{ids=JSON.parse(e.dataTransfer.getData('text/plain')||'[]')}catch{}
  ids=ids.filter(getPaper);if(ids.length) placePapers(ids,d.dataset.drop,(e.ctrlKey||e.metaKey||e.altKey)?'copy':'move');
});
window.addEventListener('beforeunload',e=>{if(Q.running){e.preventDefault();e.returnValue=''}});
boot().catch(e=>{app.innerHTML=`<div class="auth"><div class="auth-card"><h1>Lỗi khởi động</h1><p>${esc(e.message)}</p></div></div>`});
</script>
</body>
</html>
